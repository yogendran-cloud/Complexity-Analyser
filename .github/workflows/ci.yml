name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tools
        run: python -m pip install --upgrade build twine

      - name: Install core library without optional dependencies
        run: python -m pip install --no-deps -e .

      - name: Run core tests
        run: python -m unittest -v test_analyzer

      - name: Install optional dashboard dependency
        run: python -m pip install ".[dashboard]"

      - name: Run dashboard tests
        run: python -m unittest -v test_dashboard

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify artifact contents and clean external install
        run: python -c "import glob, subprocess, sys; wheel=glob.glob('dist/*.whl')[0]; sdist=glob.glob('dist/*.tar.gz')[0]; subprocess.run([sys.executable, 'scripts/verify_distribution.py', wheel, sdist], check=True)"
