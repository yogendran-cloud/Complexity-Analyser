[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity-analyzer-empirical"
version = "0.1.0"
description = "Empirically estimate Python callable runtime growth and peak traced memory"
readme = "README.md"
authors = [{ name = "YogendranPT" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.49,<2.0"]

[project.urls]
Repository = "https://github.com/yogendran-cloud/Complexity-Analyser"
Issues = "https://github.com/yogendran-cloud/Complexity-Analyser/issues"

[tool.setuptools]
py-modules = ["complexity_analyzer_empirical", "dashboard", "sample_algorithms"]
include-package-data = false
